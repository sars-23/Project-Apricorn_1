version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apricorn-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-apricorn}
      POSTGRES_USER: ${DB_USERNAME:-apricorn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apricorn}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-apricorn} -d ${DB_NAME:-apricorn}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
