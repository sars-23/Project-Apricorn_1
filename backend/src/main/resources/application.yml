spring:
  application:
    name: apricorn-backend
  profiles:
    default: dev
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.apricorn: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION:3600000}

judge:
  mode: ${JUDGE_MODE:docker}
  java-image: eclipse-temurin:21-jdk
  max-output-bytes: 1048576
  compile-timeout-ms: 10000
  container-memory-mb: 256
  container-cpus: 0.5
