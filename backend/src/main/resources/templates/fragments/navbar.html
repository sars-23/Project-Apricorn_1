<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark-glass sticky-top shadow-sm border-bottom border-secondary border-opacity-50">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" th:href="@{/}">
                <i class="bi bi-box-fill text-primary-custom fs-4 me-2"></i>
                Project Apricorn
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    
                    <!-- Guest Links -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item ms-lg-2" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-outline-light rounded-pill px-4" th:href="@{/login}">Login</a>
                    </li>
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-primary rounded-pill px-4 fw-medium" th:href="@{/register}">Register</a>
                    </li>

                    <!-- Authenticated Links -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/problems}">Problems</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/profile}">Profile</a>
                    </li>
                    
                    <li class="nav-item dropdown ms-lg-3 mt-2 mt-lg-0" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5"></i>
                            <span sec:authentication="name" class="fw-bold"></span>
                            <span class="badge bg-primary ms-1" sec:authentication="principal.authorities[0].authority"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark shadow-sm" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li><a class="dropdown-item" th:href="@{/submissions}"><i class="bi bi-journal-code me-2"></i>Submissions</a></li>
                            <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-gear me-2"></i>Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
                        </ul>
                    </li>
                    
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
