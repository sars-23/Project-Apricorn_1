<!DOCTYPE html>
<html th:replace="~{layout :: html}">
<head>
    <th:block th:fragment="headContent"></th:block>
</head>
<body>
    <div th:fragment="mainContent" class="container d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 150px);">
        <div class="col-md-6 col-lg-4">
            <div class="card glass p-4 shadow-lg border-0">
                <div class="text-center mb-4">
                    <i class="bi bi-box-fill fs-1 text-primary-custom mb-2"></i>
                    <h2 class="fw-bold">Welcome Back</h2>
                    <p class="text-muted">Sign in to continue to Apricorn</p>
                </div>
                
                <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control form-control-lg bg-dark text-white border-secondary" id="email" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg bg-dark text-white border-secondary" id="password" required>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input bg-dark border-secondary" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">Remember Me</label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-3">Sign In</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted">Don't have an account? <a th:href="@{/register}" class="text-primary-custom text-decoration-none">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <th:block th:fragment="scripts"></th:block>
</body>
</html>
