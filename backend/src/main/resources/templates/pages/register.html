<!DOCTYPE html>
<html th:replace="~{layout :: html}">
<head>
    <th:block th:fragment="headContent"></th:block>
</head>
<body>
    <div th:fragment="mainContent" class="container d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 150px);">
        <div class="col-md-6 col-lg-5 my-5">
            <div class="card glass p-4 shadow-lg border-0">
                <div class="text-center mb-4">
                    <i class="bi bi-box-fill fs-1 text-primary-custom mb-2"></i>
                    <h2 class="fw-bold text-white">Create an Account</h2>
                    <p class="text-secondary">Join Apricorn and start mastering Java</p>
                </div>
                
                <div id="register-error" class="alert alert-danger d-none" role="alert"></div>

                <form id="register-form">
                    <div class="mb-3">
                        <label for="username" class="form-label text-light-custom">Username</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-light-custom">Email address</label>
                        <input type="email" class="form-control bg-dark text-white border-secondary" id="email" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="password" class="form-label text-light-custom">Password</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary" id="password" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="confirmPassword" class="form-label text-light-custom">Confirm Password</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary" id="confirmPassword" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-3">Register</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted">Already have an account? <a th:href="@{/login}" class="text-primary-custom text-decoration-none">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <th:block th:fragment="scripts"></th:block>
</body>
</html>
