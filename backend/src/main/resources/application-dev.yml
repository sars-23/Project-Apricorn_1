spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apricorn}
    username: ${DB_USERNAME:apricorn}
    password: ${DB_PASSWORD:apricorn}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.apricorn: DEBUG
    org.hibernate.SQL: DEBUG
