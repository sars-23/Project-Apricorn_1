spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/apricorn
    username: apricorn
    password: apricorn
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/apricorn
    user: apricorn
    password: apricorn

jwt:
  secret: supersecretkey_for_testing_purposes_only_which_is_long_enough
  expiration-ms: 3600000

judge:
  mode: docker
  java-image: eclipse-temurin:21-jdk
  max-output-bytes: 1048576
  compile-timeout-ms: 10000
  container-memory-mb: 256
  container-cpus: 0.5

logging:
  level:
    com.apricorn: INFO
