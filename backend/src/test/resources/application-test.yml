spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///apricorn_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

jwt:
  secret: supersecretkey_for_testing_purposes_only_which_is_long_enough
  expiration-ms: 3600000

judge:
  mode: docker
  java-image: eclipse-temurin:21-jdk
  max-output-bytes: 1048576
  compile-timeout-ms: 10000
  container-memory-mb: 256
  container-cpus: 0.5

logging:
  level:
    com.apricorn: INFO
