spring:
  datasource:
    url: jdbc:h2:mem:apricorn_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    url: jdbc:h2:mem:apricorn_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    user: sa
    password: 
    locations:
      - classpath:db/test-seed
      - classpath:db/migration

jwt:
  secret: supersecretkey_for_testing_purposes_only_which_is_long_enough
  expiration-ms: 3600000

judge:
  mode: docker
  java-image: eclipse-temurin:21-jdk
  max-output-bytes: 1048576
  compile-timeout-ms: 10000
  container-memory-mb: 256
  container-cpus: 0.5

logging:
  level:
    com.apricorn: INFO
